<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14263f"/>
      <stop offset="55%" stop-color="#1b3a63"/>
      <stop offset="100%" stop-color="#0d1b2e"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b9bff"/>
      <stop offset="100%" stop-color="#2f6feb"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fc2ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8fc2ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- 雷达扇形 -->
  <g opacity="0.55">
    <path d="M512 640 L512 300 A340 340 0 0 1 852 640 Z" fill="url(#beam)" opacity="0.25"/>
    <circle cx="512" cy="640" r="250" fill="none" stroke="#4d8ff0" stroke-opacity="0.35" stroke-width="6"/>
    <circle cx="512" cy="640" r="160" fill="none" stroke="#4d8ff0" stroke-opacity="0.28" stroke-width="6"/>
  </g>

  <!-- 舰体 -->
  <path d="M512 168 L672 430 L512 512 L352 430 Z" fill="url(#hull)"/>
  <path d="M512 512 L688 566 L512 812 L336 566 Z" fill="url(#hull)" opacity="0.92"/>
  <path d="M512 512 L688 566 L512 812 Z" fill="#1843a0" opacity="0.55"/>

  <!-- 舰桥高光 -->
  <path d="M512 300 L568 400 L512 432 L456 400 Z" fill="#dbeaff" opacity="0.9"/>

  <!-- 直播中指示灯 -->
  <circle cx="790" cy="238" r="46" fill="#e8223f"/>
  <circle cx="790" cy="238" r="78" fill="none" stroke="#e8223f" stroke-opacity="0.45" stroke-width="10"/>
</svg>
