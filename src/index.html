  // 官方抽屉 / 弹窗是否正开着（开了就先让机器人停手，别跟人抢）
  //
  // 这里必须判得严：抖音的抽屉关掉后 DOM 节点通常还留着，只是被 transform 移出屏幕，
  // 只看 display/opacity 会把它当成"还开着"，于是机器人永远在让位、什么都不干。
  // 所以除了尺寸和样式，还要 (1) 真的落在视口里 (2) 中心点能点到它自己或它的子节点。
  function officialBusy() {
    const vw = window.innerWidth || (document.documentElement && document.documentElement.clientWidth) || 0;
    const vh = window.innerHeight || (document.documentElement && document.documentElement.clientHeight) || 0;
    const vis = (el) => {
      if (!el) return false;
      const r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return false;
      // 出屏（抽屉收起后常这样）不算
      if (r.right < 4 || r.left > vw - 4 || r.bottom < 4 || r.top > vh - 4) return false;
      const cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return false;
      return true;
    };
    // 中心点能不能真的点到它（排除被别的层盖住 / 移出屏幕的残留节点）
    const hittable = (el) => {
      try {
        const r = el.getBoundingClientRect();
        const x = Math.min(Math.max(r.left + r.width / 2, 1), vw - 1);
        const y = Math.min(Math.max(r.top + r.height / 2, 1), vh - 1);
        const hit = document.elementFromPoint(x, y);
        if (!hit) return false;
        return hit === el || el.contains(hit) || hit.contains(el);
      } catch (e) {
        return false;
      }
    };
    const sig = (el) => String((el && el.getAttribute && el.getAttribute('class')) || '').slice(0, 60);

    const mask = document.querySelector('.okee-current-live-drawer-mask-show');
    if (vis(mask)) return { busy: true, why: 'drawer-mask', el: sig(mask) };

    const modal = Array.from(document.querySelectorAll('[class*="modal-content-inner"]')).find((el) => vis(el) && hittable(el));
    if (modal) return { busy: true, why: 'modal', el: sig(modal) };

    try {
      if (document.body && document.body.style.overflow === 'hidden') {
        const anyDrawer = Array.from(document.querySelectorAll('.okee-current-live-drawer-body')).find((el) => vis(el) && hittable(el));
        if (anyDrawer) return { busy: true, why: 'drawer-body', el: sig(anyDrawer) };
      }
    } catch (e) {}
    return { busy: false, why: '' };
  }

  // 校验一个坐标现在还能不能点（在视口内 + 没被浮层挡住）
  function pointOk(x, y) {
    const px = Number(x);
    const py = Number(y);
    if (!(px > 0) || !(py > 0)) return { ok: false, reason: 'bad-point' };
    if (!inViewport(px, py)) return { ok: false, reason: 'out-of-view' };
    let hit = null;
    try { hit = document.elementFromPoint(px, py); } catch (e) { hit = null; }
    if (!hit) return { ok: false, reason: 'nothing' };
    return { ok: true, tag: hit.tagName, text: norm(hit.textContent).slice(0, 24), cls: String(hit.getAttribute('class') || '').slice(0, 40) };
  }

  // 按券名找那一行的「发放优惠券」按钮坐标（抽屉需已打开）
  function couponRowBtn(name) {
    const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
    const want = norm(name);
    const rows = couponRows();
    if (!rows.length) return { ok: false, reason: 'no-row' };
    let hit = rows.find((x) => String(x.cells[0] || '').indexOf(want) >= 0);
    if (!hit) {   // 名字可能带「复制ID」等尾巴，退一步按前缀/包含匹配
      hit = rows.find((x) => want && (String(x.cells[0] || '').indexOf(want.slice(0, 6)) >= 0));
    }
    if (!hit) return { ok: false, reason: 'row-not-found', names: rows.map((x) => x.cells[0]) };
    // 券多了表格会滚动：先把这一行滚进可视区再量坐标，否则点空
    revealEl(hit.btn);
    const r = hit.btn.getBoundingClientRect();
    if (r.width < 2) return { ok: false, reason: 'btn-invisible' };
    const abs = absCenterOf(hit.btn) || { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2) };
    if (!inViewport(abs.x, abs.y)) return { ok: false, reason: 'row-out-of-view', name: hit.cells[0], point: abs };
    return { ok: true, name: hit.cells[0], point: abs };
  }

  // 读发放确认弹窗：数量/时长的小圆点档位（含禁用状态）+ 确认/取消坐标
  function couponModalState() {
    const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
    // 页面里可能同时存在多个 modal 骨架（隐藏的旧弹层），必须挑「可见且带圆点」的那个，
    // 否则会读到空弹层 → 表现为"弹窗读不到档位"。
    const modals = Array.from(document.querySelectorAll('[class*="modal-content-inner"]')).filter((el) => {
      const r = el.getBoundingClientRect();
      if (r.width < 120 || r.height < 60) return false;
      const cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return false;
      return !!el.querySelector('label[class*="radio"]');
    });
    const modal = modals[0];
    if (!modal) return { ok: false, reason: 'modal-not-found' };
    const labels = Array.from(modal.querySelectorAll('label[class*="radio"]'));
    const qty = [];
    const dur = [];
    let section = 'qty'; // 数量区在前、时长区在后；见到「N分钟」即切换
    labels.forEach((l) => {
      const t = norm(l.textContent);
      if (!t) return;
      if (/^[0-9]+分钟$/.test(t)) section = 'dur';
      const inp = l.querySelector('input');
      const r = l.getBoundingClientRect();
      (section === 'qty' ? qty : dur).push({
        text: t,
        disabled: /disabled/.test(String(l.getAttribute('class') || '')) || !!(inp && inp.disabled),
        checked: !!(inp && inp.checked),
        x: Math.round(r.x + r.width / 2),
        y: Math.round(r.y + r.height / 2)
      });
    });
    const btnOf = (want) => {
      const b = Array.from(modal.querySelectorAll('button')).find((x) => norm(x.textContent) === want);
      if (!b) return null;
      const r = b.getBoundingClientRect();
      return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2) };
    };
    return {
      ok: true,
      qty: qty.filter((q) => q.text),
      dur: dur.filter((d) => d.text),
      confirm: btnOf('确定发放'),
      cancel: btnOf('取消'),
      close: (() => { const c = modal.querySelector('[class*="modal-close-icon"]'); if (!c) return null; const r = c.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2) }; })()
    };
  }

  // 在弹窗里点某个档位（按文案），点前确认可用
  function couponPick(text) {
    const st = couponModalState();
    if (!st.ok) return st;
    const all = st.qty.concat(st.dur);
    const hit = all.find((o) => o.text === text && !o.disabled);
    if (!hit) return { ok: false, reason: 'option-disabled', options: all.map((o) => o.text + (o.disabled ? '(禁)' : '')) };
    return { ok: true, point: { x: hit.x, y: hit.y }, text: hit.text };
  }

  // 2026-10-21 真机验证：商品卡操作区有 [class*="seckill-btn-container"] 闪电入口，
  // 点开是「投放秒杀」抽屉，内容在 iframe（eos.douyin.com/life_marketing/drop-spike）里：
  //   投放方式(立即投放/定时投放) · 投放库存 · 每人限购 · 秒杀倒计时(关闭/开启) · 提交/取消
  // 抽屉里有两个 .byted-input-number-input：第 1 个=投放库存，第 2 个=每人限购。

  // 主页面：扫商品卡上的秒杀入口，返回卡片序号 + 名称 + 按钮中心点（布局像素）
  function seckillScan() {
    const cont = document.querySelector('#live-card-list');
    if (!cont) return { ok: false, reason: 'no-card-list', items: [] };
    const cards = Array.from(cont.querySelectorAll('div[role="button"][aria-label]'));
    const btns = Array.from(cont.querySelectorAll('[class*="seckill-btn-container"]'));
    const items = [];
    btns.forEach((b) => {
      let el = b, cardIdx = -1;
      while (el && cardIdx < 0) { cardIdx = cards.indexOf(el); el = el.parentElement; }
      const r = b.getBoundingClientRect();
      if (!isVisible(b) || r.width < 2) return;
      items.push({
        i: cardIdx >= 0 ? cardIdx + 1 : 0,
        name: cardIdx >= 0 ? cardName(cards[cardIdx]) : '',
        x: Math.round(r.x + r.width / 2),
        y: Math.round(r.y + r.height / 2)
      });
    });
    return { ok: true, cards: cards.length, items };
  }

  // 把 iframe 里的元素坐标换算成顶层页面布局坐标（同源，frameElement 可访问）
  function absPoint(el) {
    let x = 0, y = 0, win = window;
    let fe = null;
    try { fe = win.frameElement; } catch (e) { fe = null; }
    const r = el.getBoundingClientRect();
    x += r.x; y += r.y;
    while (fe) {
      const fr = fe.getBoundingClientRect();
      x += fr.x; y += fr.y;
      win = win.parent;
      try { fe = win.frameElement; } catch (e) { fe = null; }
    }
    return { x: Math.round(x), y: Math.round(y) };
  }

  // 注意：上面已有通用的 centerOf（返回 {x,y,lx,ly}，locate 依赖 lx/ly 做遮挡检测）。
  // 这里必须另起名字，否则会覆盖掉通用版本，导致 locate() 的 elementFromPoint 收到 undefined，
  // 全部真实点击被判成「被遮挡」——表现为所有功能点了没反应。
  function absCenterOf(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return null;
    const p = absPoint(el);
    return { x: p.x + Math.round(r.width / 2), y: p.y + Math.round(r.height / 2) };
  }

  // 在秒杀 iframe 内按文本找「叶子」可点元素（编辑 / 修改 / 追加库存 …）
  // 后台这些入口多是 span/div，不是 button，只按 button 找会永远找不到。
  function seckillFindEl(texts) {
    const list = (Array.isArray(texts) ? texts : [texts]).map((s) => String(s || '')).filter(Boolean);
    let hit = null;
    document.querySelectorAll('button,span,div,a,label,li').forEach((el) => {
      if (hit || el.children.length) return;
      const t = norm(el.textContent);
      if (!t || list.indexOf(t) < 0) return;
      const r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return;
      hit = el;
    });
    return hit;
  }

  // 点秒杀 iframe 内按文本的控件（DOM 点击，绕开坐标误差）
  function seckillClickText(texts) {
    const el = seckillFindEl(texts);
    if (!el) return { ok: false, reason: 'not-found', want: (Array.isArray(texts) ? texts : [texts]).join('/') };
    try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
    el.click();
    return { ok: true, text: norm(el.textContent) };
  }

  // 秒杀「详情」抽屉：已投放后点闪电图标看到的是详情，不是投放表单。
  // 真机文案（2026-10-21）：
  //   秒杀详情 / 0 订单数 / 秒杀件数 / 订单金额 / 活动名称 / 秒杀价 / 活动ID / 秒杀库存(总) /
  //   授权时段 / 活动商品 / 活动状态 进行中 / 投放方式 定时投放 / 每人限购 / 投放时间 / 投放库存 N / 编辑 / 停止投放
  // 剩余 = 投放库存 - 秒杀件数（投放出去还没卖掉的件数），补充就靠它判断。
  function seckillDetail() {
    const body = norm(document.body ? document.body.textContent : '');
    // 主文档里也有「投放库存」这类模板文字，必须真读到数字才算详情页
    if (!/投放库存\s*[0-9,]+/.test(body)) return { ok: false, reason: 'not-detail' };
    if (!/秒杀详情|秒杀件数|活动状态/.test(body)) return { ok: false, reason: 'not-detail' };
    const num = (re) => {
      const m = body.match(re);
      return m ? Number(String(m[1]).replace(/[,，]/g, '')) : null;
    };
    const findBtn = (re) => {
      let hit = null;
      document.querySelectorAll('button,span,div,a').forEach((el) => {
        if (hit || el.children.length) return;
        if (!re.test(norm(el.textContent))) return;
        const r = el.getBoundingClientRect();
        if (r.width < 4 || r.height < 4) return;
        hit = el;
      });
      return hit;
    };
    const editEl = findBtn(/^(编辑|修改)$/);
    const stopEl = findBtn(/^(停止投放|停止秒杀|终止投放|取消投放)$/);
    const stock = num(/投放库存\s*([0-9,]+)/);
    const sold = num(/秒杀件数\s*([0-9,]+)/);
    const total = num(/秒杀库存\s*([0-9,]+)/);
    const limit = num(/每人限购\s*([0-9,]+)/);
    const status = (body.match(/(进行中|未开始|待开始|已结束|已停止)/) || [])[1] || '';
    const tm = body.match(/投放时间\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*~\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})/);
    const remain = (stock != null && sold != null) ? Math.max(0, stock - sold) : null;
    return {
      ok: true,
      status,
      stock,
      sold,
      total,
      limit,
      remain,
      buyMode: (body.match(/(定时投放|立即投放)/) || [])[1] || '',
      timeFrom: tm ? tm[1] : '',
      timeTo: tm ? tm[2] : '',
      hasEdit: !!editEl,
      points: { edit: absCenterOf(editEl), stop: absCenterOf(stopEl) },
      text: body.slice(0, 240)
    };
  }

  // 读抽屉里的状态文案（进行中 / 剩余 / 已投放库存 …），编辑态和投放态都能用
  function seckillStatus() {
    if (!document.querySelector('.byted-input-number-input') && !document.querySelector('.byted-form-item')) {
      return { ok: false, reason: 'not-seckill-frame' };
    }
    const body = norm(document.body.textContent);
    const grab = (re) => {
      const m = body.match(re);
      return m ? Number(String(m[1]).replace(/,/g, '')) : null;
    };
    const num = (sel) => {
      const el = document.querySelector(sel);
      return el ? String(el.value || '') : '';
    };
    const inputs = Array.from(document.querySelectorAll('.byted-input-number-input')).map((el) => String(el.value || ''));
    const btns = [];
    document.querySelectorAll('button,span,div,a').forEach((el) => {
      if (el.children.length) return;
      const t = norm(el.textContent);
      if (!t || t.length > 8) return;
      if (!/^(编辑|修改|停止投放|停止秒杀|终止投放|追加库存|补充库存|提交|取消|确定|确认)$/.test(t)) return;
      const r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return;
      if (btns.indexOf(t) < 0) btns.push(t);
    });
    return {
      ok: true,
      nums: inputs,
      buttons: btns,
      remain: grab(/剩余[^0-9]{0,6}([0-9,]+)/),
      total: grab(/(?:总库存|投放库存)[^0-9]{0,6}([0-9,]+)/),
      sold: grab(/(?:已售|已抢|已卖出)[^0-9]{0,6}([0-9,]+)/),
      statusText: (body.match(/(进行中|未开始|已结束|已停止)/) || [])[1] || '',
      hasEdit: !!seckillFindEl(['编辑', '修改', '追加库存', '补充库存', '增加库存']),
      sample: body.slice(0, 260)
    };
  }

  // 在投放秒杀 iframe 内执行：读表单状态 + 返回各控件的真实坐标
  function seckillForm() {
    const numInputs = document.querySelectorAll('.byted-input-number-input');
    if (!numInputs.length) return { ok: false, reason: 'form-not-found' };
    const radioByText = (want) => {
      let hit = null;
      document.querySelectorAll('label').forEach((el) => {
        if (hit) return;
        const input = el.querySelector('input[type="radio"]');
        if (!input || norm(el.textContent) !== want) return;
        const r = el.getBoundingClientRect();
        if (r.width < 2) return;
        hit = { el, checked: input.checked };
      });
      return hit;
    };
    const btnByText = (want) => {
      let hit = null;
      document.querySelectorAll('button').forEach((el) => {
        if (hit) return;
        if (norm(el.textContent) !== want) return;
        const r = el.getBoundingClientRect();
        if (r.width < 2) return;
        hit = el;
      });
      return hit;
    };
    // 「投放时长」这类分段控件其实是 span/div 叶子节点（不是 button），
    // 只按 button 找会永远找不到 —— 之前"时长没选上、提交一直禁用"就是这个原因。
    const leafByText = (want) => {
      let hit = null;
      document.querySelectorAll('span,div,button,label').forEach((el) => {
        if (hit || el.children.length) return;
        if (norm(el.textContent) !== want) return;
        const r = el.getBoundingClientRect();
        if (r.width < 4 || r.height < 4) return;
        hit = el;
      });
      return hit;
    };
    // 找停止类按钮（秒杀进行中才会出现，文案待真投放后核实）
    let stopBtn = null;
    document.querySelectorAll('button').forEach((el) => {
      if (stopBtn) return;
      const t = norm(el.textContent);
      if (/^(停止投放|停止秒杀|终止投放|终止秒杀|取消投放)$/.test(t)) {
        const r = el.getBoundingClientRect();
        if (r.width > 2) stopBtn = el;
      }
    });
    const stock = numInputs[0];
    const limit = numInputs[1] || null;
    // 已投放过的秒杀：抽屉里是「查看态」，要先进「编辑」才能改投放库存。
    // 剩余补充就是靠这个入口：编辑 → 在原投放库存上追加 → 提交。
    const editEl = seckillFindEl(['编辑', '修改', '追加库存', '补充库存', '增加库存']);
    const editText = editEl ? norm(editEl.textContent) : '';
    const submit = btnByText('提交');
    const cancel = btnByText('取消');
    const nowR = radioByText('立即投放');
    const schedR = radioByText('定时投放');
    // 投放时长按钮（立即投放才有）：10分钟 / 30分钟 / 60分钟 / 自定义
    const durBtn = {};
    ['10分钟', '30分钟', '60分钟', '自定义'].forEach((t) => {
      durBtn[t] = absCenterOf(leafByText(t) || btnByText(t));
    });
    // 自定义时长输入框（HH:MM:SS）
    const customDur = document.querySelector('input.byted-input.byted-input-size-md');
    // 定时投放的「选择开始/结束日期时间」按钮
    const rangeItems = Array.from(document.querySelectorAll('.byted-date-time-range-picker-item'));
    const body = norm(document.body.textContent);
    const remain = body.match(/剩余[^0-9]{0,6}([0-9,]+)/);
    const activeDur = (() => {
      const hit = Array.from(document.querySelectorAll('button')).find((b) => /^(10分钟|30分钟|60分钟)$/.test(norm(b.textContent)) && /primary/.test(String(b.className)));
      return hit ? norm(hit.textContent) : '';
    })();
    return {
      ok: true,
      mode: nowR && nowR.checked ? 'now' : 'sched',
      activeDur,
      stockValue: stock ? stock.value : '',
      limitValue: limit ? limit.value : '',
      customDurValue: customDur ? customDur.value : '',
      submitDisabled: submit ? !!submit.disabled : true,
      countdown: (radioByText('开启') || {}).checked ? 'on' : 'off',
      remain: remain ? Number(remain[1].replace(/,/g, '')) : null,
      hasEdit: !!editEl,
      editText,
      statusText: (body.match(/(进行中|未开始|已结束|已停止)/) || [])[1] || '',
      bodySample: body.slice(0, 240),
      points: {
        stock: absCenterOf(stock),
        limit: absCenterOf(limit),
        edit: absCenterOf(editEl),
        now: absCenterOf(nowR && nowR.el),
        sched: absCenterOf(schedR && schedR.el),
        dur10: durBtn['10分钟'],
        dur30: durBtn['30分钟'],
        dur60: durBtn['60分钟'],
        durCustom: durBtn['自定义'],
        customDur: absCenterOf(customDur),
        timeStart: absCenterOf(rangeItems[0]),
        timeEnd: absCenterOf(rangeItems[1]),
        countdownOn: absCenterOf(radioByText('开启') && radioByText('开启').el),
        submit: absCenterOf(submit),
        cancel: absCenterOf(cancel),
        stop: absCenterOf(stopBtn)
      }
    };
  }

  // 定时投放：在日历面板里选开始/结束时间（"YYYY-MM-DD HH:mm"）。
  // 真机结构（2026-10-21）：
  //   日期格 .byted-date-item（本月带 byted-date-grid-in / today / grid-start / grid-end）
  //   时 .byted-hour-select-item(24) / 分 .byted-minute-select-item(60) / 秒 .byted-second-select-item
  //   没选日期时这些列全是 -disabled；选完日期后可用项才解除禁用
  //   底部 .byted-date-time-range-picker-confirm 就是「确定」
  // 关键：这是「范围」选择器 —— 点确定后往往自动进入"选结束"阶段，
  // 这时必须继续在同一个面板里选结束，不能再去点结束按钮（会重置掉开始）。
  async function seckillPickRange(startStr, endStr) {
    const norm2 = (s) => String(s || '').replace(/\s+/g, ' ').trim();
    const items = Array.from(document.querySelectorAll('.byted-date-time-range-picker-item'));
    if (items.length < 2) return { ok: false, reason: 'no-range-input' };

    const popperOf = () => {
      const list = Array.from(document.querySelectorAll('.byted-date-time-range-picker-popper'))
        .filter((el) => el.getBoundingClientRect().width > 200);
      return list[list.length - 1] || null;
    };
    const confirmOf = (popper) => popper.querySelector('.byted-date-time-range-picker-confirm')
      || Array.from(popper.querySelectorAll('button')).find((b) => norm2(b.textContent) === '确定');

    // 在已打开的面板里选「日期 + 时:分 + 秒00」
    const pickInPanel = async (popper, str) => {
      const m = String(str || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
      if (!m) return { ok: false, reason: 'bad-time-format' };
      const day = String(Number(m[3]));
      const dateCells = Array.from(popper.querySelectorAll('.byted-date-item'))
        .filter((el) => /byted-date-grid-in|byted-date-today|byted-date-grid-start|byted-date-grid-end/.test(el.className))
        .filter((el) => !/disabled/.test(el.className));
      const cell = dateCells.find((el) => norm2(el.textContent) === day);
      if (!cell) return { ok: false, reason: 'day-not-found:' + day };
      cell.click();
      await sleep(420);

      const choose = (sel, want) => {
        const okOnes = Array.from(popper.querySelectorAll(sel)).filter((el) => !/disabled/.test(el.className));
        if (!okOnes.length) return false;
        // 精确匹配优先（列表是循环滚动，不靠滚动、直接点目标值；找不到才取最近的更大值）
        const hit = okOnes.find((el) => norm2(el.textContent) === want)
          || okOnes.find((el) => Number(norm2(el.textContent)) >= Number(want))
          || okOnes[okOnes.length - 1];
        try { hit.scrollIntoView({ block: 'nearest' }); } catch (e) {}
        hit.click();
        return true;
      };
      choose('.byted-hour-select-item', String(Number(m[4])).padStart(2, '0'));
      await sleep(220);
      choose('.byted-minute-select-item', String(Number(m[5])).padStart(2, '0'));
      await sleep(220);
      choose('.byted-second-select-item', '00');   // 秒统一取 00，避免出现 59 秒的怪时间
      await sleep(220);
      return { ok: true };
    };

    const commit = async (popper) => {
      const c = confirmOf(popper);
      if (!c) return { ok: false, reason: 'no-confirm' };
      if (c.disabled) return { ok: false, reason: 'confirm-disabled' };
      c.click();
      await sleep(450);
      return { ok: true };
    };

    // ① 打开面板（点「选择开始日期时间」）
    items[0].click();
    await sleep(750);
    let popper = popperOf();
    if (!popper) return { ok: false, reason: 'no-popper' };

    const s1 = await pickInPanel(popper, startStr);
    if (!s1.ok) return { ok: false, reason: 'start:' + s1.reason };

    // ② 确定开始 —— 之后面板通常还开着并切到「选结束」
    const c1 = await commit(popper);
    if (!c1.ok) return { ok: false, reason: 'start-commit:' + c1.reason };

    let samePopper = popperOf();
    if (!samePopper) {
      // 面板被关掉了：重新点结束按钮
      items[1].click();
      await sleep(750);
      samePopper = popperOf();
      if (!samePopper) return { ok: false, reason: 'no-popper-end' };
    }
    const s2 = await pickInPanel(samePopper, endStr);
    if (!s2.ok) return { ok: false, reason: 'end:' + s2.reason };
    const c2 = await commit(samePopper);
    if (!c2.ok) return { ok: false, reason: 'end-commit:' + c2.reason };

    await sleep(400);
    const texts = items.map((el) => norm2(el.textContent));
    const okStart = texts[0] && texts[0].indexOf('选择') < 0;
    const okEnd = texts[1] && texts[1].indexOf('选择') < 0;
    return { ok: !!(okStart && okEnd), start: texts[0], end: texts[1], texts };
  }

  // 在 iframe 内执行：给第 idx 个数字输入框写值（React 受控组件，setNativeValue 兼容）
  function seckillSetNum(idx, val) {
    const inputs = document.querySelectorAll('.byted-input-number-input');
    const el = inputs[idx];
    if (!el) return { ok: false, reason: 'input-not-found' };
    setNativeValue(el, String(val));
    try { el.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {}
    return { ok: true, value: el.value };
  }

  // 自定义投放时长（HH:MM:SS，如 0:45:00 = 45 分钟）
  function seckillSetCustomDur(hms) {
    const el = document.querySelector('input.byted-input.byted-input-size-md');
    if (!el) return { ok: false, reason: 'input-not-found' };
    setNativeValue(el, String(hms));
    try { el.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {}
    return { ok: true, value: el.value };
  }

  // 关掉抽屉：优先点右上角 ✕，找不到就让调用方按 Esc
  function seckillClose() {
    let hit = null;
    document.querySelectorAll('[class*="drawer-dialog"] [class*="close"], [class*="drawer"] [class*="close-icon"], [class*="drawer-header"] [class*="close"]').forEach((el) => {
      if (hit) return;
      const r = el.getBoundingClientRect();
      if (isVisible(el) && r.width > 6) hit = el;
    });
    if (!hit) return { ok: false, reason: 'no-close-btn' };
    return { ok: true, point: absCenterOf(hit) };
  }

  // ---------- 一键适配（自动分析后台，免手动绑定） ----------
  // 识别名单按功能分组：主页面 + 同源 iframe（秒杀抽屉在 life_marketing/drop-spike）一起扫。
  // 命中的直接写进选择器；没命中的写清「什么时候能看到」，不留空白。
  function autoDetect() {
    const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
    const out = { ok: true, items: [] };
    const add = (group, key, label, found, selector, sample) => {
      out.items.push({ group, key, label, found: !!found, selector: found ? selector : '', sample: String(sample || '').slice(0, 42) });
    };

    // 收集所有同源 document（主页面 + 抽屉/表单 iframe，最多 3 层）
    const roots = [];
    const collect = (doc, depth) => {
      if (!doc || depth > 3) return;
      roots.push(doc);
      let frames = [];
      try { frames = Array.from(doc.querySelectorAll('iframe')); } catch (e) { frames = []; }
      frames.forEach((f) => {
        let d = null;
        try { d = f.contentDocument; } catch (e) { d = null; }
        if (d) collect(d, depth + 1);
      });
    };
    collect(document, 0);
    const inRoots = (fn) => {
      for (const d of roots) { try { const r = fn(d); if (r) return r; } catch (e) {} }
      return null;
    };
    const leaf = (d, re) => {
      let hit = null;
      (d.querySelectorAll ? d.querySelectorAll('button,span,div,a,label') : []).forEach((el) => {
        if (hit || el.children.length) return;
        const t = norm(el.textContent);
        if (!t || !re.test(t)) return;
        const r = el.getBoundingClientRect();
        if (r.width < 4 || r.height < 4) return;
        hit = el;
      });
      return hit;
    };

    // ① 商品 / 讲解
    const cardList = document.querySelector('#live-card-list');
    const cardCount = cardList ? cardList.querySelectorAll('div[role="button"][aria-label]').length : 0;
    add('商品', 'card', '商品卡片', cardCount > 0, 'xpath=(//*[@id="live-card-list"]//div[@role="button"][@aria-label])[{{n}}]', cardCount + ' 张卡');
    let actFound = false;
    if (cardCount) {
      const c0 = cardList.querySelector('div[role="button"][aria-label]');
      actFound = !!(c0 && (findByText('讲解', c0) || c0.querySelector('[class*="talking-btn"]')));
    }
    add('商品', 'cardAction', '「讲解 / 取消讲解」按钮', actFound, 'class=talking-btn\ntext=讲解', actFound ? '卡片操作区可见' : '鼠标移到商品卡上才出现');

    // ② 评论（回评/发评）
    const cWrap = document.querySelector('[class*="comment-wrap"]');
    const cInput = cWrap ? cWrap.querySelector('textarea[placeholder*="输入评论"],textarea') : null;
    add('评论', 'commentInput', '评论输入框', !!cInput, 'textarea[placeholder*="输入评论"]\n[class*="comment-wrap"] textarea', cInput ? cInput.getAttribute('placeholder') || 'textarea' : '');
    const cList = document.querySelector('#comment_all_tab_list_container');
    const cItem = cList ? cList.querySelector('div[class*="item-"]') : null;
    add('评论', 'commentItem', '评论列表条目', !!cItem, '#comment_all_tab_list_container > div[class*="item-"]', cItem ? norm(cItem.textContent).slice(0, 30) : '容器在即通过，条目等新评论');
    add('评论', 'commentUser', '　└ 评论昵称', !!(cItem && cItem.querySelector('[class*="item-name"]')), '[class*="item-name"]', '');
    add('评论', 'commentText', '　└ 评论内容', !!(cItem && cItem.querySelector('[class*="item-content"]')), '[class*="item-content"]', '');
    add('评论', 'sendButton', '发送方式（回车发送）', true, '', '输入框支持 Enter');

    // ③ 优惠券
    const couponCard = findByText('优惠券');
    add('优惠券', 'couponEntry', '优惠券入口', !!couponCard, 'text=优惠券', couponCard ? norm(couponCard.textContent).slice(0, 20) : '');
    const rows = document.querySelectorAll('[class*="okee-current-live-Table-Row"]');
    add('优惠券', 'couponItem', '券列表（表格行）', rows.length > 0, '[class*="okee-current-live-Table-Row"]', rows.length ? rows.length + ' 行' : '打开券面板后可见');
    const grant = findByText('发放优惠券');
    add('优惠券', 'couponGrantBtn', '「发放优惠券」按钮', !!grant, 'text=发放优惠券', grant ? '面板已打开' : '打开券面板后可见');
    const modal = Array.from(document.querySelectorAll('[class*="modal-content-inner"]')).find((el) => {
      const r = el.getBoundingClientRect();
      return r.width > 120 && el.querySelector('label[class*="radio"]');
    });
    add('优惠券', 'couponCountInput', '发放档位（数量 / 时长）', !!modal, '弹窗内 label.radio 档位', modal ? modal.querySelectorAll('label[class*="radio"]').length + ' 个档位' : '点「发放优惠券」后可见');
    const confirm = findByText('确定发放');
    add('优惠券', 'couponConfirmBtn', '「确定发放」按钮', true, 'text=确定发放', confirm ? '已出现' : '发放弹窗里出现');

    // ④ 秒杀（入口在卡片上，抽屉表单在同源 iframe 里）
    const skBtns = document.querySelectorAll('[class*="seckill-btn-container"]');
    add('秒杀', 'seckillEntry', '秒杀入口（闪电按钮）', skBtns.length > 0, '[class*="seckill-btn-container"]', skBtns.length + ' 个商品有闪电按钮');
    const numInput = inRoots((d) => d.querySelector('.byted-input-number-input'));
    add('秒杀', 'seckillStock', '投放库存 / 每人限购输入框', !!numInput, 'iframe 内 .byted-input-number-input', numInput ? '抽屉已打开（第 1 个=库存，第 2 个=限购）' : '点闪电按钮后可见');
    const drawerHit = inRoots((d) => {
      if (d.querySelector('.byted-form-item') || d.querySelector('.byted-input-number-input')) return '投放表单（drop-spike iframe）';
      const b = norm(d.body && d.body.textContent);
      if (/投放库存\s*[0-9,]+/.test(b)) return '秒杀详情（live-detail iframe）';
      return null;
    });
    add('秒杀', 'seckillForm', '秒杀抽屉（投放表单 / 详情）', !!drawerHit, 'life_marketing/drop-spike | live-detail', drawerHit || '点闪电按钮后可见');
    const durLeaf = inRoots((d) => leaf(d, /^(10分钟|30分钟|60分钟)$/));
    add('秒杀', 'seckillDuration', '投放时长档位（立即投放）', !!durLeaf, 'text=10分钟 / 30分钟 / 60分钟', durLeaf ? 'span 分段控件（不是 button）' : '切到「立即投放」才出现');
    const rangePick = inRoots((d) => d.querySelector('.byted-date-time-range-picker-item'));
    add('秒杀', 'seckillTime', '投放时间选择器（定时投放）', !!rangePick, '.byted-date-time-range-picker-item', rangePick ? '日历范围选择器' : '切到「定时投放」才出现');
    const editLeaf = inRoots((d) => leaf(d, /^(编辑|修改|追加库存|补充库存)$/));
    add('秒杀', 'seckillEdit', '「编辑」（已投放后改库存）', !!editLeaf, 'text=编辑 / 修改', editLeaf ? '可进编辑追加库存' : '该商品还没有投放中的秒杀');
    const detailHit = inRoots((d) => {
      const b = norm(d.body && d.body.textContent);
      const stock = (b.match(/投放库存\s*([0-9,]+)/) || [])[1];
      if (!stock) return null;
      const st = (b.match(/(进行中|未开始|待开始|已结束|已停止)/) || [])[1] || '—';
      const sold = (b.match(/秒杀件数\s*([0-9,]+)/) || [])[1] || '—';
      return `状态 ${st} · 投放库存 ${stock} · 已卖 ${sold}`;
    });
    add('秒杀', 'seckillDetail', '秒杀详情（状态 / 投放库存 / 已卖）', !!detailHit, '详情抽屉文案（同源 iframe）', detailHit || '已投放后点闪电图标可见（当前不是详情态）');
    add('秒杀', 'seckillRemain', '剩余（投放库存 − 秒杀件数）', !!detailHit, '投放库存 - 秒杀件数', detailHit ? '可算剩余，用于自动补充' : '需真实投放一次后可见');
    const stopLeaf = inRoots((d) => leaf(d, /^(停止投放|停止秒杀|终止投放|取消投放)$/));
    add('秒杀', 'seckillStop', '「停止投放」按钮', !!stopLeaf, 'text=停止投放', stopLeaf ? '可一键停止' : '秒杀进行中才出现');

    out.good = out.items.filter((i) => i.found).length;
    out.total = out.items.length;
    out.frames = roots.length;
    return out;
  }

  // 诊断用：dump 日期时间选择器的浮层结构（日历格 + 时分列的真实类名/坐标）
  function probeCalendar() {
    // 页面上有多个 date-time 相关容器（触发器/输入区/footer/真正的日历），
    // 取「面积最大且含数字格」的那个才是日历面板。
    const cands = Array.from(document.querySelectorAll('[class*="picker-popper"],[class*="date-time-range"],[class*="date-picker"]'))
      .map((el) => ({ el, r: el.getBoundingClientRect() }))
      .filter((x) => x.r.width > 200 && x.r.height > 120)
      .sort((a, b) => b.r.width * b.r.height - a.r.width * a.r.height);
    const popper = cands.length ? cands[0].el : null;
    if (!popper) return { ok: false, reason: 'no-popper' };
    const r = popper.getBoundingClientRect();
    const cells = [];
    popper.querySelectorAll('td,span,div,li').forEach((el) => {
      if (el.children.length) return;
      const t = norm(el.textContent);
      if (!/^\d{1,2}$/.test(t)) return;
      const b = el.getBoundingClientRect();
      if (b.width < 4 || b.height < 4) return;
      cells.push({
        t,
        tag: el.tagName.toLowerCase(),
        cls: String(el.getAttribute('class') || '').slice(0, 70),
        pcls: String((el.parentElement && el.parentElement.getAttribute('class')) || '').slice(0, 70),
        gcls: String((el.parentElement && el.parentElement.parentElement && el.parentElement.parentElement.getAttribute('class')) || '').slice(0, 70),
        x: Math.round(b.x + b.width / 2),
        y: Math.round(b.y + b.height / 2)
      });
    });
    return {
      ok: true,
      box: [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)],
      count: cells.length,
      cells: cells.slice(0, 160),
      html: popper.outerHTML.replace(/<svg[\s\S]*?<\/svg>/g, '[S]').slice(0, 9000)
    };
  }

  // 诊断用：列出当前所有可见的弹层/对话框（类名 + 文案 + 坐标）
  function probeModals() {
    const out = [];
    const seen = new Set();
    ['[class*="modal"]', '[class*="dialog"]', '[class*="drawer"]', '[class*="popconfirm"]'].forEach((sel) => {
      document.querySelectorAll(sel).forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.width < 60 || r.height < 40) return;
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden') return;
        const key = String(el.getAttribute('class') || '') + '|' + Math.round(r.x) + ',' + Math.round(r.y);
        if (seen.has(key)) return;
        seen.add(key);
        const norm2 = norm(el.textContent);
        out.push({
          cls: String(el.getAttribute('class') || '').slice(0, 100),
          box: [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)],
          text: norm2.slice(0, 160),
          radios: el.querySelectorAll('label[class*="radio"]').length,
          btns: Array.from(el.querySelectorAll('button')).map((b) => norm(b.textContent)).filter(Boolean).slice(0, 6)
        });
      });
    });
    return { ok: true, count: out.length, items: out.slice(0, 12), viewport: [window.innerWidth, window.innerHeight] };
  }

  // 诊断用：把秒杀抽屉里的按钮/标签全列出来（排查"找不到投放时长按钮"）
  function seckillDump() {
    // 只在秒杀抽屉所在的 iframe 里有效（否则 runInFrames 会命中主框架，dump 出一堆无关按钮）
    if (!document.querySelector('.byted-input-number-input')) return { ok: false, reason: 'not-seckill-frame' };
    const out = { ok: true, buttons: [], labels: [], spans: [], counts: { button: 0, label: 0 } };
    // 时长/时间这类分段控件常是 div/span，专门捡出短文本节点
    document.querySelectorAll('div,span').forEach((el) => {
      if (el.children.length) return;
      const t = norm(el.textContent);
      if (!t || t.length > 8) return;
      if (!/分钟|小时|自定义|立即|定时|开启|关闭|提交|取消/.test(t)) return;
      const r = el.getBoundingClientRect();
      if (r.width < 4) return;
      out.spans.push({ t, tag: el.tagName.toLowerCase(), cls: String(el.getAttribute('class') || '').slice(0, 70), w: Math.round(r.width) });
    });
    document.querySelectorAll('button').forEach((b) => {
      const t = norm(b.textContent);
      if (!t) return;
      out.counts.button++;
      const r = b.getBoundingClientRect();
      out.buttons.push({ t: t.slice(0, 14), cls: String(b.className || '').slice(0, 70), dis: b.disabled, w: Math.round(r.width) });
    });
    document.querySelectorAll('label').forEach((l) => {
      const t = norm(l.textContent);
      if (!t) return;
      out.counts.label++;
      out.labels.push({ t: t.slice(0, 14), cls: String(l.className || '').slice(0, 50), checked: !!(l.querySelector('input') || {}).checked });
    });
    return out;
  }

  // 提交后可能弹二次确认（"确定投放？"）：找到可见弹层里的「确定/确认」就点掉
  function seckillConfirm() {
    const cands = Array.from(document.querySelectorAll('[class*="modal-content-inner"],[class*="modal-body"],[class*="popconfirm"]'))
      .filter((el) => {
        const r = el.getBoundingClientRect();
        if (r.width < 120 || r.height < 50) return false;
        const cs = getComputedStyle(el);
        return cs.display !== 'none' && cs.visibility !== 'hidden';
      });
    for (const el of cands) {
      const ok = Array.from(el.querySelectorAll('button')).find((b) => /^(确定|确认|确定投放|确认投放|确定提交)$/.test(norm(b.textContent)) && !b.disabled);
      if (ok) {
        const t = norm(ok.textContent);
        ok.click();
        return { ok: true, clicked: t };
      }
    }
    return { ok: false, reason: 'no-confirm' };
  }

  // 读后台的提示条（成功/失败 toast），用于判断到底成没成
  function readToast() {
    const sels = ['[class*="toast"]', '[class*="Toast"]', '[class*="message"]', '[class*="Message"]', '[class*="notice"]', '[class*="Notification"]'];
    const found = [];
    for (const sel of sels) {
      document.querySelectorAll(sel).forEach((el) => {
        const t = norm(el.textContent);
        if (!t || t.length > 80) return;
        const r = el.getBoundingClientRect();
        if (r.width < 40 || r.height < 10) return;
        const cs = getComputedStyle(el);
        if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return;
        if (found.indexOf(t) < 0) found.push(t);
      });
    }
    return { ok: found.length > 0, text: found.slice(0, 3).join(' / ') };
  }

  // 点「投放时长」档位（span 分段控件，DOM 点击最稳）
  function seckillSetDuration(text) {
    const want = String(text || '');
    let hit = null;
    document.querySelectorAll('span,div,button,label').forEach((el) => {
      if (hit || el.children.length) return;
      if (norm(el.textContent) !== want) return;
      const r = el.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return;
      hit = el;
    });
    if (!hit) return { ok: false, reason: 'not-found', want };
    hit.click();
    return { ok: true, text: want };
  }

  // 读「投放时间」两个按钮上的文案（验证日历是否真的选上了）
  function seckillTimeText() {
    const items = Array.from(document.querySelectorAll('.byted-date-time-range-picker-item'));
    return { ok: items.length > 0, items: items.map((el) => norm(el.textContent)) };
  }

  // 诊断用：看某个元素的可见性/命中测试（排查"点了没反应"）
  function inspectPoint(sel) {
    const el = resolve(sel);
    if (!el) return { ok: false, reason: 'not-found' };
    const c = revealAndMeasure(el);
    if (!c) return { ok: false, reason: 'no-center' };
    const cs = getComputedStyle(el);
    const hit = document.elementFromPoint(c.lx, c.ly);
    const r = el.getBoundingClientRect();
    return {
      ok: true,
      tag: el.tagName,
      cls: String(el.getAttribute('class') || '').slice(0, 80),
      display: cs.display, visibility: cs.visibility, opacity: cs.opacity, pointerEvents: cs.pointerEvents,
      rect: [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)],
      center: c,
      hitTag: hit && hit.tagName,
      hitCls: hit ? String(hit.getAttribute('class') || '').slice(0, 70) : '',
      hasOnclick: !!el.onclick,
      inner: el.outerHTML.replace(/<svg[\s\S]*?<\/svg>/g, '[S]').slice(0, 260)
    };
  }

  // ---------- 评论条目 / 置顶（悬停才出现的操作） ----------
  // 真机结构（2026-10-21）：#comment_all_tab_list_container > div[class*="item-"]，
  // 条目里 昵称 [class*="item-name"]、内容 [class*="item-content"]；
  // 「置顶」是在某条评论上悬停后才出现的操作（不在面板顶部），所以按文本定位那条再点。
  function commentItemEls() {
    const clsOf = (el) => String((el && el.getAttribute && el.getAttribute('class')) || '');
    // 标签页（全部 / 高选品意向…）的类名里也有 item-，必须排掉，否则会拿标签当评论
    const isTab = (el) => /tab/i.test(clsOf(el)) || !!(el.closest && el.closest('[class*="tab-bar"],[class*="tabBar"],[class*="tabs-"]'));
    const hasBody = (el) => !!(el.querySelector && el.querySelector('[class*="item-content"],[class*="item-name"],[class*="item-txt"],[class*="content-"]'));

    const list = document.querySelector('#comment_all_tab_list_container');
    let items = [];
    if (list) {
      items = Array.from(list.children).filter((el) => /item-/.test(clsOf(el)) && !isTab(el));
    }
    if (!items.length) {
      const wrap = document.querySelector('[class*="comment-wrap"]');
      if (wrap) {
        items = Array.from(wrap.querySelectorAll('[class*="item-"]')).filter((el) => !isTab(el) && hasBody(el));
      }
    }
    // 兜底：直接按语义类（昵称/内容）反推条目
    if (!items.length) {
      const scope = document.querySelector('[class*="comment-wrap"]') || document;
      const seeds = Array.from(scope.querySelectorAll('[class*="item-name"],[class*="item-content"]'));
      items = Array.from(new Set(seeds.map((n) => n.parentElement))).filter(Boolean);
    }
    return items.filter((el) => {
      const t = norm(el.textContent);
      return t && t.length <= 220;
    });
  }

  // 按文本找刚发的那条（取最后一条命中的：新评论在底部）
  function commentItemByText(text) {
    const want = norm(text).slice(0, 10);
    const items = commentItemEls();
    if (!items.length) return { ok: false, reason: 'no-comment-item', count: 0 };
    const idx = (() => {
      for (let i = items.length - 1; i >= 0; i--) {
        if (want && norm(items[i].textContent).indexOf(want) >= 0) return i;
      }
      return -1;
    })();
    if (idx < 0) return { ok: false, reason: 'text-not-found', count: items.length, items: items.slice(-3).map((el) => norm(el.textContent).slice(0, 30)) };
    const el = items[idx];
    const c = centerOf(el);
    if (!c) return { ok: false, reason: 'no-center' };
    return { ok: true, index: idx, count: items.length, x: c.x, y: c.y, text: norm(el.textContent).slice(0, 40) };
  }

  // 读某条评论上能点的操作（悬停后才渲染）：置顶 / 取消置顶 / 其它图标
  function commentItemActions(text) {
    const want = norm(text).slice(0, 10);
    const items = commentItemEls();
    if (!items.length) return { ok: false, reason: 'no-comment-item' };
    let el = null;
    for (let i = items.length - 1; i >= 0; i--) {
      if (!want || norm(items[i].textContent).indexOf(want) >= 0) { el = items[i]; break; }
    }
    if (!el) el = items[items.length - 1];
    const scopes = [el].concat(el.parentElement ? [el.parentElement] : []);
    const out = [];
    scopes.forEach((scope) => {
      scope.querySelectorAll('button,span,div,a,i,svg').forEach((n) => {
        const cls = String(n.getAttribute('class') || '');
        const t = norm(n.textContent);
        const pinClass = /pin|ding/i.test(cls) && !/padding|pinyin/i.test(cls);
        const pinText = /^(置顶|取消置顶|置顶评论|置顶该评论)$/.test(t);
        // 只认「文字就是置顶的叶子节点」或「类名带 pin 的图标」。
        // 父级容器（整条评论）的 textContent 里也含「置顶」两个字，不能当成按钮点。
        if (!pinText && !pinClass) return;
        if (!pinClass && n.children.length) return;
        if (!pinText && t.length > 12) return;
        const r = n.getBoundingClientRect();
        if (r.width < 4 || r.height < 4) return;
        const cs = getComputedStyle(n);
        if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return;
        const item = {
          t: t.slice(0, 10),
          tag: (n.tagName || '').toLowerCase(),
          cls: cls.slice(0, 70),
          x: Math.round(r.x + r.width / 2),
          y: Math.round(r.y + r.height / 2)
        };
        if (!out.some((x) => x.x === item.x && x.y === item.y && x.t === item.t)) out.push(item);
      });
    });
    // 顺带把这条评论上其它可见的短文字/小按钮也列出来（置顶可能叫别的名字或只有图标）
    const others = [];
    el.querySelectorAll('*').forEach((n) => {
      if (n.children.length) return;
      const t = norm(n.textContent);
      if (!t || t.length > 10) return;
      if (n.closest('[class*="item-name"],[class*="item-content"]')) return;
      const r = n.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return;
      const cs = getComputedStyle(n);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return;
      others.push(t.slice(0, 10));
    });
    const iconCls = [];
    el.querySelectorAll('svg,[class*="icon"],[class*="Icon"]').forEach((n) => {
      const r = n.getBoundingClientRect();
      if (r.width < 4) return;
      const cs = getComputedStyle(n);
      if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return;
      const c = String(n.getAttribute('class') || '').split(' ')[0];
      if (c) iconCls.push(c);
    });
    return {
      ok: out.length > 0,
      actions: out.slice(0, 8),
      others: Array.from(new Set(others)).slice(0, 10),
      icons: Array.from(new Set(iconCls)).slice(0, 8),
      itemText: norm(el.textContent).slice(0, 40)
    };
  }

  // 评论条目上「悬停才出现的操作图标」。
  // 真机结构（2026-10-22 实测）：div.item-* > div.hover-button-* > div.icon-* > span > svg
  //   第 1 个图标 = 图钉 = 置顶（点了后台提示「置顶审核中，审核通过后将在用户侧展示1分钟」）
  //   第 2 个图标 = 气泡 = 回复
  // 图标没有文字也没有 aria-label，只能按位置识别；这里把每个图标的坐标都返回，由上层取第 1 个。
  function commentHoverIcons(text) {
    const items = commentItemEls();
    if (!items.length) return { ok: false, reason: 'no-comment-item' };
    const want = norm(text).slice(0, 10);
    let el = null;
    for (let i = items.length - 1; i >= 0; i--) {
      if (!want || norm(items[i].textContent).indexOf(want) >= 0) { el = items[i]; break; }
    }
    if (!el) el = items[items.length - 1];
    const box = el.querySelector('[class*="hover-button"]');
    if (!box) return { ok: false, reason: 'no-hover-button', itemText: norm(el.textContent).slice(0, 40) };
    const icons = Array.from(box.children).map((c, i) => {
      const r = c.getBoundingClientRect();
      return {
        i,
        cls: String(c.getAttribute('class') || '').slice(0, 40),
        x: Math.round(r.x + r.width / 2),
        y: Math.round(r.y + r.height / 2),
        w: Math.round(r.width),
        h: Math.round(r.height)
      };
    }).filter((x) => x.w > 2 && x.h > 2);
    return {
      ok: icons.length > 0,
      icons,
      // 第一个默认当置顶（真机确认），上层可再按提示文字纠正
      pin: icons[0] || null,
      itemText: norm(el.textContent).slice(0, 40),
      count: icons.length
    };
  }

  // 读最后一条评论（置顶自检用：悬停它看能点出什么）
  function commentLastItem() {
    const items = commentItemEls();
    if (!items.length) return { ok: false, reason: 'no-comment-item' };
    const el = items[items.length - 1];
    const c = centerOf(el);
    if (!c) return { ok: false, reason: 'no-center' };
    return { ok: true, count: items.length, x: c.x, y: c.y, text: norm(el.textContent).slice(0, 60), cls: String(el.getAttribute('class') || '').slice(0, 60) };
  }

  // 装载时就装上"听筒"：中控台一直在轮询，room_id 从这些 URL 里现成可取。
  // 不做任何拦截/改写，只是把 URL 抄一份，页面功能不受影响。
  try { installSniffer(); } catch (e) {}

  window.__TP = {
    version: '0.9',
    click, clickIn, type, pressEnter, readList, count, probe, replyTo, resolve, resolveAll, isVisible, norm,
    parseSel, scan, cssPath, attrSel, goodsList, locate, locateIn, textIn, closeAnyPopup,
    reveal, revealIn, revealEl, loadAll, markInject, humanInfo, pointOk, apiIds, apiComment,
    apiReq, apiRoomStats, apiCardStats, apiShelf, apiLiveStatus, apiSwitchCard, officialBusy,
    seckillScan, seckillForm, seckillSetNum, seckillSetCustomDur, seckillClose, seckillPickRange, seckillTimeText, seckillDump, seckillSetDuration, seckillConfirm, readToast,
