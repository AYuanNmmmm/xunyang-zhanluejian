<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>巡洋战略舰</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="brand"><span class="dot"></span>巡洋战略舰<span class="ver" id="appVer"></span></div>
  <div class="topbar-mid">
    <select id="siteSelect" class="site-select" title="预设站点">
      <option value="https://eos.douyin.com/">抖音生活服务 eos 后台</option>
      <option value="https://life.douyin.com/">抖音生活服务商家后台</option>
      <option value="custom">自定义地址…</option>
    </select>
    <input id="urlInput" class="url-input" placeholder="输入后台地址后回车" spellcheck="false">
    <button id="btnGo" class="btn-sm">前往</button>
  </div>
  <div class="topbar-right">
    <div class="zoom-ctrl" title="内嵌页面缩放">
      <button id="zoomOut" class="btn-sm" title="缩小">－</button>
      <button id="zoomLabel" class="btn-sm zoom-label" title="点击恢复 100%">100%</button>
      <button id="zoomIn" class="btn-sm" title="放大">＋</button>
      <button id="zoomFit" class="btn-sm" title="记住常用比例，一键切换">适宽</button>
    </div>
    <label class="switch-label" title="只记录动作、不真正点击，用来验证选择器">
      <input type="checkbox" id="dryRun">
      <span>试运行</span>
    </label>
    <span id="statusBadge" class="badge badge-idle">空闲</span>
    <button id="btnStopAll" class="btn-stop">全部停止</button>
  </div>
</header>

<!-- ============ 主体 ============ -->
<main class="layout">

  <!-- 左栏：功能菜单 → 运行中 → 累计统计（自上而下，都在运行日志上方） -->
  <div class="side">
    <nav class="nav" id="nav">
      <button class="nav-item active" data-tab="goods"><i>①</i><span>商品</span></button>
      <button class="nav-item" data-tab="popup"><i>②</i><span>弹讲解</span></button>
      <button class="nav-item" data-tab="comment"><i>③</i><span>自动发评</span></button>
      <button class="nav-item" data-tab="coupon"><i>④</i><span>发优惠券</span></button>
      <button class="nav-item" data-tab="data"><i>⑤</i><span>实时数据</span></button>
      <button class="nav-item" data-tab="settings"><i>⑥</i><span>设置</span></button>
      <button class="nav-item" data-tab="selectors"><i>⑦</i><span>高级</span></button>
    </nav>

    <!-- 实时运行状态：紧贴功能菜单下方，运行日志上方 -->
    <aside class="runpane" id="runBar"><span class="runbar-idle">空闲</span></aside>

    <!-- 累计统计：由 app.js 渲染 -->
    <section class="statsbox" id="statsBox"></section>
  </div>

  <section class="panel-wrap">
    <section class="panel" id="panel"><!-- 由 app.js 渲染 --></section>
  </section>

  <section class="browser">
    <div class="browser-bar">
      <span id="pageTitle" class="page-title">未加载</span>
      <div class="browser-tools">
        <button id="btnBack" class="btn-icon" title="后退">‹</button>
        <button id="btnReload" class="btn-icon" title="刷新">↻</button>
        <button id="btnDevTools" class="btn-icon" title="打开开发者工具">⌥</button>

      </div>
    </div>
    <div class="pick-hint" id="pickHint" hidden>
      拾取模式：把鼠标移到目标元素上，<b>单击</b>即选中；按 <b>Esc</b> 取消。
      <span id="pickTargetLabel"></span>
    </div>
    <div class="browser-views" id="browserViews">
      <!-- 后台工作页（自动任务专用，用户看不见）：由 app.js 按需创建 webview -->
      <div class="worker-host" id="workerHost"></div>
      <div class="view-col" data-id="0">
        <div class="view-col-bar">
          <span class="col-tag">主控</span>
          <span class="col-title" id="colTitle0">未加载</span>
        </div>
        <webview id="view" src="https://eos.douyin.com/livesite/live/current" partition="persist:douyin" allowpopups webpreferences="backgroundThrottling=false"></webview>
      </div>
    </div>
  </section>
</main>

<!-- ============ 运行日志 ============ -->
<footer class="logwrap" id="logwrap">
  <div class="logmain">
    <div class="log-head">
      <div class="log-title">运行日志 <span id="logCount">0</span></div>
      <!-- 分功能页签：只看某一个功能的日志 -->

        <button class="log-tab active" data-tag="all">全部</button>
        <button class="log-tab" data-tag="popup">弹讲解</button>
        <button class="log-tab" data-tag="comment">发评</button>
        <button class="log-tab" data-tag="coupon">发券</button>
        <button class="log-tab" data-tag="seckill">秒杀</button>
        <button class="log-tab" data-tag="goods">商品</button>
        <button class="log-tab" data-tag="sys">系统</button>
      </div>
      <div class="log-tools">
        <label class="switch-label small"><input type="checkbox" id="logAutoScroll" checked><span>自动滚动</span></label>
        <button id="btnClearLog" class="btn-sm ghost">清空</button>
        <button id="btnExportLog" class="btn-sm ghost">导出</button>
        <button id="btnToggleLog" class="btn-icon" title="折叠">▾</button>
      </div>
    </div>
    <div class="log-body" id="logBody"></div>
  </div>
</footer>

<!-- ===================================================================
     页面侧自动化库：注入到内嵌网页的执行环境里运行
     不参与本应用的 DOM
     =================================================================== -->
<script type="text/plain" id="tp-lib">
(() => {
  if (window.__TP) return;

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => Math.floor(a + Math.random() * (b - a + 1));

  function isVisible(el) {
    if (!el || !el.getBoundingClientRect) return false;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return false;
    const cs = getComputedStyle(el);
    if (cs.visibility === 'hidden' || cs.display === 'none' || cs.opacity === '0') return false;
    return true;
  }

  function norm(s) { return (s || '').replace(/\s+/g, ' ').trim(); }

  // ---------- 真人操作探测 ----------
  // 目的：自动化在后台跑的时候，真人可能正在点页面、打字、滚轮。
  // 真人一动，机器人就应该让位（PageBus 会读这里的时间戳）。
  // 难点：CDP 注入的事件 isTrusted 同样是 true，和真人一样无法区分 ——
  // 所以每次注入前先 markInject(ms)，在窗口期内的可信事件一律算"自己发的"。
  let injectUntil = 0;
  let humanAt = 0;
  let humanKind = '';
  function markInject(ms) { injectUntil = Date.now() + Math.max(200, Number(ms) || 1200); }
  function humanInfo() {
    return { age: humanAt ? Date.now() - humanAt : 1e9, kind: humanKind, inject: Date.now() < injectUntil };
  }
  (function installHumanWatch() {
    const types = ['mousedown', 'keydown', 'wheel', 'touchstart', 'pointerdown'];
    const on = (e) => {
      if (!e.isTrusted) return;
      if (Date.now() < injectUntil) return;
      humanAt = Date.now();
      humanKind = e.type;
    };
    types.forEach((t) => { try { document.addEventListener(t, on, true); } catch (e) {} });
  })();

  function findByText(want, root) {
    const scope = root || document.body || document;
    const nodes = scope.querySelectorAll('*');
    const exact = [];
    const partial = [];
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const t = norm(n.textContent);
      if (!t) continue;
      if (t === want) exact.push(n);
      else if (t.indexOf(want) >= 0) partial.push(n);
    }
    const best = (arr) => {
      if (!arr.length) return null;
      arr.sort((a, b) => (a.textContent.length - b.textContent.length) || (a.childElementCount - b.childElementCount));
      for (const el of arr) if (isVisible(el)) return el;
      return arr[0];
    };
    return best(exact) || best(partial);
  }

  // ---------- 选择器解析 ----------
  // 支持一行一个候选（从上到下依次尝试），也支持用 || 分隔
  // 每个候选可以是：CSS / .类名 / 裸类名（自动补点）/ #id / text=文案 / class=片段 / xpath=表达式 / 以 / 开头的 XPath
  const TAGS = {
    a: 1, abbr: 1, article: 1, aside: 1, audio: 1, b: 1, body: 1, br: 1, button: 1, canvas: 1,
    div: 1, dl: 1, dt: 1, dd: 1, em: 1, fieldset: 1, figure: 1, footer: 1, form: 1, h1: 1, h2: 1,
    h3: 1, h4: 1, h5: 1, h6: 1, header: 1, hr: 1, i: 1, iframe: 1, img: 1, input: 1, label: 1,
    li: 1, main: 1, nav: 1, ol: 1, option: 1, p: 1, pre: 1, s: 1, section: 1, select: 1,
    small: 1, span: 1, strong: 1, svg: 1, table: 1, tbody: 1, td: 1, textarea: 1, th: 1,
    thead: 1, tr: 1, u: 1, ul: 1, video: 1
  };

  function normalizeOne(s) {
    let t = String(s).trim();
    if (!t) return '';
    // 允许直接粘 DevTools 里复制的整段属性：class="live-btn primary"
    const mAttr = t.match(/^class\s*=\s*["']([^"']+)["']$/i);
    if (mAttr) t = 'class=' + mAttr[1];
    if (/^(text|class|css|xpath|id)=/i.test(t)) {
      return t.replace(/^(TEXT|CLASS|CSS|XPATH|ID)=/, (m) => m.toLowerCase());
    }
    if (t.charAt(0) === '/' ) return 'xpath=' + t;
    if ('.#[>*:'.indexOf(t.charAt(0)) >= 0) return t;
    if (/^[A-Za-z][\w-]*$/.test(t)) return TAGS[t.toLowerCase()] ? t : '.' + t;
    return t;
  }

  function parseSel(selector) {
    if (!selector) return [];
    const out = [];
    String(selector).split(/\r?\n|\|\|/).forEach((p) => {
      const n = normalizeOne(p);
      if (n && out.indexOf(n) < 0) out.push(n);
    });
    return out;
  }

  function xpathFind(xp, root) {
    try {
      const doc = (root && root.ownerDocument) || document;
      const r = doc.evaluate(xp, root || doc, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null);
      return r.singleNodeValue || null;
    } catch (e) { return null; }
  }

  function classFind(cls, root, all) {
    const scope = root || document;
    const raw = String(cls).trim().replace(/^\.+/, '');
    if (!raw) return all ? [] : null;
    // 先按完整类名精确匹配（空格分隔 = 多个类同时具备）
    const exact = '.' + raw.split(/\s+/).filter(Boolean).join('.');
    let arr = [];
    try { arr = Array.from(scope.querySelectorAll(exact)); } catch (e) { arr = []; }
    if (arr.length) return all ? arr : arr[0];
    // 再按类名片段模糊匹配（应对 class 哈希后缀变动，如 live-btn-a1b2）
    const want = raw.toLowerCase();
    const fuzzy = [];
    let nodes = [];
    try { nodes = scope.querySelectorAll('[class]'); } catch (e) { return all ? [] : null; }
    for (let i = 0; i < nodes.length && fuzzy.length < 400; i++) {
      const cn = nodes[i].getAttribute('class') || '';
      if (cn.toLowerCase().indexOf(want) >= 0) fuzzy.push(nodes[i]);
    }
    if (all) return fuzzy;
    for (const el of fuzzy) if (isVisible(el)) return el;
    return fuzzy[0] || null;
  }

  function resolveOne(s, root) {
    if (!s) return null;
    if (s.indexOf('xpath=') === 0) return xpathFind(s.slice(6), root);
    if (s.indexOf('text=') === 0) return findByText(s.slice(5).trim(), root);
    if (s.indexOf('class=') === 0) return classFind(s.slice(6), root, false);
    if (s.indexOf('id=') === 0) {
      try { return (root || document).querySelector('#' + s.slice(3).trim()); } catch (e) { return null; }
    }
    if (s.indexOf('css=') === 0) s = s.slice(4);
    try { return (root || document).querySelector(s); } catch (e) { return null; }
  }

  function resolveAllOne(s, root) {
    if (!s) return [];
    if (s.indexOf('xpath=') === 0) {
      const el = xpathFind(s.slice(6), root);
      return el ? [el] : [];
    }
    if (s.indexOf('text=') === 0) {
      const el = findByText(s.slice(5).trim(), root);
      return el ? [el] : [];
    }
    if (s.indexOf('class=') === 0) return classFind(s.slice(6), root, true);
    if (s.indexOf('css=') === 0) s = s.slice(4);
    try { return Array.from((root || document).querySelectorAll(s)); } catch (e) { return []; }
  }

  function resolve(selector, root) {
    const list = parseSel(selector);
    for (const s of list) {
      const el = resolveOne(s, root);
      if (el) return el;
    }
    return null;
  }

  function resolveAll(selector, root) {
    const list = parseSel(selector);
    for (const s of list) {
      const arr = resolveAllOne(s, root);
      if (arr.length) return arr;
    }
    return [];
  }

  // 元素 → 最稳的几种写法（data-e2e / id 优先，其次文本）
  function attrSel(el) {
    if (!el || !el.getAttribute) return '';
    const e2e = el.getAttribute('data-e2e') || el.getAttribute('data-testid') || el.getAttribute('data-spm');
    if (e2e) {
      const name = el.getAttribute('data-e2e') ? 'data-e2e' : (el.getAttribute('data-testid') ? 'data-testid' : 'data-spm');
      return el.tagName.toLowerCase() + '[' + name + '="' + e2e + '"]';
    }
    if (el.id && /^[A-Za-z][\w-]*$/.test(el.id)) return '#' + el.id;
    return '';
  }

  function clickable(el) {
    let cur = el, depth = 0;
    while (cur && cur !== document.body && depth < 6) {
      const tag = cur.tagName ? cur.tagName.toLowerCase() : '';
      const role = cur.getAttribute && cur.getAttribute('role');
      if (tag === 'button' || tag === 'a' || role === 'button' ||
          (cur.onclick) || (cur.getAttribute && cur.getAttribute('tabindex') === '0')) return cur;
      cur = cur.parentElement; depth++;
    }
    return el;
  }

  function fire(el) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const base = { bubbles: true, cancelable: true, view: window, clientX: cx, clientY: cy, button: 0 };
    const seq = ['pointerover', 'mouseover', 'pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'];
    for (const type of seq) {
      let ev;
      if (type.indexOf('pointer') === 0 && window.PointerEvent) ev = new PointerEvent(type, base);
      else ev = new MouseEvent(type, base);
      el.dispatchEvent(ev);
    }
  }

  // ---------- 坐标定位（配合主进程发真实鼠标事件） ----------
  // 返回元素中心的视口坐标；元素在 iframe 里就逐层加上外框偏移，统一换算到 webview 坐标系。
  // 注意：这里只测量，不滚动 —— 滚动统一交给 revealEl。
  // 旧版用 el.scrollIntoView({block:'center'})，一旦页面有 scroll-behavior:smooth
  // 就是异步动画，紧接着量到的还是旧坐标，点击会打偏。
  function centerOf(el) {
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return null;
    const lx = r.left + r.width / 2;
    const ly = r.top + r.height / 2;
    let x = lx;
    let y = ly;
    try {
      let win = window;
      while (win.frameElement) {
        const fr = win.frameElement.getBoundingClientRect();
        x += fr.left;
        y += fr.top;
        win = win.parent;
      }
    } catch (e) { /* 跨域框架按主坐标系近似 */ }
    return { x: Math.round(x), y: Math.round(y), lx: Math.round(lx), ly: Math.round(ly), w: Math.round(r.width), h: Math.round(r.height) };
  }

  // 点是否落在当前视口内。中控台是 1600 宽固定布局，webview 窄的时候右侧元素会跑到视口外，
  // 这时注入的鼠标事件点在空处 —— 必须显式发现并处理，否则表现为「点了没反应」。
  function inViewport(x, y) {
    return x >= 0 && y >= 0 && x <= window.innerWidth - 1 && y <= window.innerHeight - 1;
  }

  // 在「元素所在的那个文档」里，把它从所有滚动容器中滚到看得见的位置。
  // 直接改 scrollTop/scrollLeft —— 同步生效、没有平滑动画，量出来就是最终坐标。
  function revealInDoc(el) {
    const doc = el.ownerDocument;
    const win = doc.defaultView || window;
    const boxes = [];
    let node = el.parentElement;
    while (node && node !== doc.documentElement) {
      let cs = null;
      try { cs = win.getComputedStyle(node); } catch (e) { cs = null; }
      if (cs) {
        const oy = /(auto|scroll|overlay)/.test(cs.overflowY);
        const ox = /(auto|scroll|overlay)/.test(cs.overflowX);
        if ((oy && node.scrollHeight > node.clientHeight + 2) || (ox && node.scrollWidth > node.clientWidth + 2)) boxes.push(node);
      }
      node = node.parentElement;
    }
    boxes.push(doc.scrollingElement || doc.documentElement);

    let moved = 0;
    for (let i = 0; i < boxes.length; i++) {
      const box = boxes[i];
      const isDoc = box === doc.scrollingElement || box === doc.documentElement;
      let vp;
      if (isDoc) {
        vp = { top: 0, left: 0, right: win.innerWidth || doc.documentElement.clientWidth, bottom: win.innerHeight || doc.documentElement.clientHeight };
      } else {
        vp = box.getBoundingClientRect();
      }
      const r = el.getBoundingClientRect();
      const pad = 6;
      let dy = 0;
      let dx = 0;
      // 只滚「刚好够看见」的最小距离（不是居中），滚得越少对真人干扰越小
      if (r.bottom > vp.bottom - pad) dy = Math.min(r.bottom - (vp.bottom - pad), Math.max(0, r.top - vp.top - pad));
      else if (r.top < vp.top + pad) dy = r.top - (vp.top + pad);
      if (r.right > vp.right - pad) dx = Math.min(r.right - (vp.right - pad), Math.max(0, r.left - vp.left - pad));
      else if (r.left < vp.left + pad) dx = r.left - (vp.left + pad);
      try {
        if (dy) { box.scrollTop = Math.max(0, box.scrollTop + dy); moved++; }
        if (dx) { box.scrollLeft = Math.max(0, box.scrollLeft + dx); moved++; }
      } catch (e) {}
    }
    return moved;
  }

  // 递归处理 iframe 链：元素所在文档滚完后，iframe 本身在父文档里也可能在视口外
  function revealEl(el) {
    let node = el;
    let guard = 0;
    let moved = 0;
    while (node && guard++ < 10) {
      try { moved += revealInDoc(node); } catch (e) {}
      const doc = node.ownerDocument;
      const win = doc && doc.defaultView;
      let fe = null;
      try { fe = win && win.frameElement; } catch (e) { fe = null; }
      if (!fe) break;
      node = fe;
    }
    return moved;
  }

  // 测量 + 必要时滚到可见（尽量两次内解决）
  function measureVisible(el) {
    let c = centerOf(el);
    if (!c) return null;
    for (let i = 0; i < 3 && !inViewport(c.lx, c.ly); i++) {
      const moved = revealEl(el);
      const c2 = centerOf(el);
      if (c2) c = c2;
      if (!moved) break;   // 滚不动了（页面不允许滚 / 元素比视口还大），交给调用方决定
    }
    return c;
  }

  // 老名字保留（locate / locateIn 里用过）
  function revealAndMeasure(el) { return measureVisible(el); }

  // 对外：把某个选择器对应的元素滚到可见，返回最新坐标
  function reveal(selector) {
    const el = resolve(selector);
    if (!el) return { ok: false, reason: 'not-found', selector: selector };
    const t = clickable(el);
    const moved = revealEl(t);
    const c = centerOf(t);
    if (!c) return { ok: false, reason: 'invisible' };
    return { ok: true, moved: moved, x: c.x, y: c.y, inView: inViewport(c.lx, c.ly), vw: window.innerWidth, vh: window.innerHeight };
  }

  // 同上，但目标在某个容器内部（商品卡里的小按钮）
  function revealIn(containerSelector, innerSelector) {
    const boxes = resolveAll(containerSelector);
    if (!boxes.length) return { ok: false, reason: 'container-not-found' };
    for (const box of boxes) {
      let inner = resolve(innerSelector, box);
      if (!inner && String(innerSelector).indexOf('text=') === 0) inner = findByText(String(innerSelector).slice(5).trim(), box);
      if (!inner) continue;
      const t = clickable(inner);
      const moved = revealEl(t);
      const c = centerOf(t);
      if (!c) continue;
      return { ok: true, moved: moved, x: c.x, y: c.y, inView: inViewport(c.lx, c.ly), vw: window.innerWidth, vh: window.innerHeight };
    }
    return { ok: false, reason: 'inner-not-found' };
  }

  // 长列表懒加载：商品多了以后，靠后的卡片一开始根本不在 DOM 里，需要滚到底把它加载出来
  async function loadAll(containerSelector, rounds, waitMs) {
    const cont = resolve(containerSelector);
    if (!cont) return { ok: false, reason: 'container-not-found' };
    let sc = cont;
    for (let i = 0; i < 6 && sc && sc !== document.body; i++) {
      const cs = getComputedStyle(sc);
      if (/(auto|scroll)/.test(cs.overflowY) && sc.scrollHeight > sc.clientHeight + 4) break;
      sc = sc.parentElement;
    }
    const countNow = () => cont.querySelectorAll('*').length;
    let prev = -1;
    let n = countNow();
    let steps = 0;
    for (let r = 0; r < (Number(rounds) || 10) && n !== prev; r++) {
      prev = n;
      try { if (sc) sc.scrollTop = sc.scrollHeight; } catch (e) {}
      await sleep(Number(waitMs) || 500);
      n = countNow();
      steps++;
    }
    return { ok: true, steps: steps, nodes: n, scrolled: !!(sc && sc !== document.body) };
  }

  // 检查中心点有没有被别的浮层盖住（弹窗、遮罩）——盖住就别点，免得点错东西
  function coveredBy(el, lx, ly) {
    try {
      const hit = document.elementFromPoint(lx, ly);
      if (!hit) return 'nothing';
      if (hit === el || el.contains(hit) || hit.contains(el)) return '';
      const cs = getComputedStyle(hit);
      const cls = String(hit.getAttribute('class') || '').slice(0, 40);
      return (hit.tagName || '?') + (cls ? '.' + cls : '') + (cs.position === 'fixed' ? '(浮层)' : '');
    } catch (e) { return ''; }
  }

  function locate(selector, root) {
    const el = resolve(selector, root);
    if (!el) return { ok: false, reason: 'not-found', selector: selector };
    const t = clickable(el);
    const c = revealAndMeasure(t);
    if (!c) return { ok: false, reason: 'invisible', selector: selector };
    if (!inViewport(c.lx, c.ly)) {
      return { ok: false, reason: 'out-of-view', x: c.lx, y: c.ly, vw: window.innerWidth, vh: window.innerHeight, selector: selector };
    }
    const cov = coveredBy(t, c.lx, c.ly);
    if (cov) return { ok: false, reason: 'covered', by: cov, selector: selector };
    return { ok: true, x: c.x, y: c.y, tag: t.tagName, text: norm(t.textContent).slice(0, 40) };
  }

  function locateIn(containerSelector, innerSelector) {
    const boxes = resolveAll(containerSelector);
    if (!boxes.length) return { ok: false, reason: 'container-not-found' };
    for (const box of boxes) {
      let inner = resolve(innerSelector, box);
      if (!inner && String(innerSelector).indexOf('text=') === 0) inner = findByText(String(innerSelector).slice(5).trim(), box);
      if (!inner) continue;
      const t = clickable(inner);
      const c = revealAndMeasure(t);
      if (!c) continue;
      if (!inViewport(c.lx, c.ly)) {
        return { ok: false, reason: 'out-of-view', x: c.lx, y: c.ly, vw: window.innerWidth, vh: window.innerHeight };
      }
      const cov = coveredBy(t, c.lx, c.ly);
      if (cov) return { ok: false, reason: 'covered', by: cov };
      return { ok: true, x: c.x, y: c.y, tag: t.tagName, text: norm(t.textContent).slice(0, 40) };
    }
    return { ok: false, reason: 'inner-not-found' };
  }

  // 读卡片里按钮的当前文案（判断是否「讲解中」）。只看文本，不受遮挡影响
  function textIn(containerSelector, innerSelector) {
    const boxes = resolveAll(containerSelector);
    if (!boxes.length) return { ok: false, reason: 'container-not-found' };
    const box = boxes[0];
    let inner = resolve(innerSelector, box);
    if (!inner && String(innerSelector).indexOf('text=') === 0) inner = findByText(String(innerSelector).slice(5).trim(), box);
    if (!inner) return { ok: false, reason: 'inner-not-found' };
    const t = clickable(inner);
    return { ok: true, text: norm(t.textContent).slice(0, 40), cls: String(t.getAttribute('class') || '').slice(0, 80) };
  }

  // 关掉挡路的弹窗 / 浮层。返回有没有找到并点掉
  function closeAnyPopup() {
    const words = ['关闭', '我知道了', '知道了', '以后再说', '暂不处理', '取消', '跳过'];
    for (const w of words) {
      const el = findByText(w);
      if (el && isVisible(el)) {
        const t = clickable(el);
        fire(t);
        return { ok: true, how: 'text', target: w };
      }
    }
    // 纯图标关闭按钮（右上角 ×）通常只有 aria-label 或 close 类名
    const icons = [
      '[aria-label="关闭"]', '[aria-label="close"]', '[title="关闭"]',
      '[class*="close"]', '[class*="Close"]'
    ];
    for (const s of icons) {
      let el = null;
      try { el = document.querySelector(s); } catch (e) { el = null; }
      if (el && isVisible(el)) {
        fire(clickable(el));
        return { ok: true, how: 'icon', target: s };
      }
    }
    return { ok: false, how: 'none' };
  }

  function click(selector, root) {    const el = resolve(selector, root);
    if (!el) return { ok: false, reason: 'not-found', selector };
    const t = clickable(el);
    try { t.scrollIntoView({ block: 'center', inline: 'center' }); } catch (e) {}
    fire(t);
    const r = t.getBoundingClientRect();
    return { ok: true, tag: t.tagName, text: norm(t.textContent).slice(0, 40), rect: [Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height)] };
  }

  function clickIn(containerSelector, innerSelector) {
    const box = resolveAll(containerSelector);
    if (!box.length) return { ok: false, reason: 'container-not-found' };
    for (const c of box) {
      const inner = resolve(innerSelector, c) || (innerSelector.indexOf('text=') === 0 ? findByText(innerSelector.slice(5).trim(), c) : null);
      if (inner) {
        const t = clickable(inner);
        try { t.scrollIntoView({ block: 'center' }); } catch (e) {}
        fire(t);
        return { ok: true, text: norm(t.textContent).slice(0, 40) };
      }
    }
    return { ok: false, reason: 'inner-not-found' };
  }

  function setNativeValue(el, value) {
    const proto = (el.tagName === 'TEXTAREA') ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
    const desc = Object.getOwnPropertyDescriptor(proto, 'value');
    if (desc && desc.set) desc.set.call(el, value);
    else el.value = value;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function focusEl(el) {
    try { el.scrollIntoView({ block: 'center' }); } catch (e) {}
    try { el.focus(); } catch (e) {}
    try {
      const r = el.getBoundingClientRect();
      const mk = (t) => new MouseEvent(t, { bubbles: true, clientX: r.left + 5, clientY: r.top + 5 });
      el.dispatchEvent(mk('mousedown')); el.dispatchEvent(mk('mouseup')); el.dispatchEvent(mk('click'));
    } catch (e) {}
  }

  async function type(selector, text, opts) {
    opts = opts || {};
    const el = resolve(selector);
    if (!el) return { ok: false, reason: 'not-found', selector };
    focusEl(el);
    const isCE = !!el.isContentEditable;
    if (opts.clear !== false) {
      if (isCE) { el.textContent = ''; }
      else setNativeValue(el, '');
    }
    const min = opts.min || 55, max = opts.max || 175;
    const chars = Array.from(String(text));
    for (const ch of chars) {
      if (isCE) {
        document.execCommand('insertText', false, ch);
      } else {
        setNativeValue(el, (el.value || '') + ch);
      }
      el.dispatchEvent(new KeyboardEvent('keydown', { key: ch, bubbles: true }));
      el.dispatchEvent(new KeyboardEvent('keyup', { key: ch, bubbles: true }));
      await sleep(rand(min, max));
      if (opts.microPauseChance && Math.random() < opts.microPauseChance) await sleep(rand(160, 420));
    }
    el.dispatchEvent(new Event('change', { bubbles: true }));
    return { ok: true, value: isCE ? norm(el.textContent) : el.value };
  }

  async function pressEnter(selector) {
    const el = resolve(selector) || document.activeElement;
    if (!el) return { ok: false };
    for (const type of ['keydown', 'keypress', 'keyup']) {
      el.dispatchEvent(new KeyboardEvent(type, { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true }));
    }
    return { ok: true };
  }

  function readList(itemSelector, textSelector, userSelector, limit) {
    const items = resolveAll(itemSelector);
    const out = [];
    const max = Math.min(items.length, limit || 50);
    // 关键：从「末尾」往前读最新的 N 条。评论区新评论是追加在列表末尾的，
    // 如果从头读前 N 条（旧评论），一旦评论数超过 limit，最新的评论就永远读不到，
    // 回评会看起来「失效」。这里改成倒序读最新的一批。
    for (let k = 0; k < max; k++) {
      const i = items.length - 1 - k;
      if (i < 0) break;
      const box = items[i];
      const textEl = textSelector ? (resolve(textSelector, box) || (textSelector.indexOf('text=') === 0 ? null : null)) : box;
      const userEl = userSelector ? resolve(userSelector, box) : null;
      const text = norm((textEl || box).textContent);
      const user = userEl ? norm(userEl.textContent) : '';
      if (!text) continue;
      out.push({ i, text: text.slice(0, 200), user: user.slice(0, 40) });
    }
    return out.reverse();   // 恢复成从旧到新的顺序，回评去重/规则匹配不挑顺序
  }

  function count(selector) { return resolveAll(selector).length; }

  // ---------- 商品列表抓取 ----------
  // 后台商品数量不固定，列表可能有懒加载，这里滚到底直到数量不再增长，再回顶部
  function cardName(card) {
    const bad = /^[¥￥\d]|^(已售|曝光|点击|支付|销售|讲解中|取消讲解|讲解)$/;
    let best = '';
    const nodes = card.querySelectorAll('*');
    for (let i = 0; i < nodes.length; i++) {
      const el = nodes[i];
      if (el.children.length) continue;
      const t = norm(el.textContent);
      if (t.length < 4 || t.length > 60) continue;
      if (bad.test(t)) continue;
      if (!best) best = t;
    }
    return best;
  }

  async function goodsList(opts) {
    opts = opts || {};
    const rounds = Number(opts.rounds) || 8;
    const waitMs = Number(opts.waitMs) || 700;
    const cont = document.querySelector('#live-card-list') || resolve('class=live-card-list');
    if (!cont) return { ok: false, reason: 'no-card-list', items: [] };

    // 找真正能滚的祖先
    let sc = cont;
    for (let i = 0; i < 6 && sc && sc !== document.body; i++) {
      const cs = getComputedStyle(sc);
      if (/(auto|scroll)/.test(cs.overflowY) && sc.scrollHeight > sc.clientHeight + 4) break;
      sc = sc.parentElement;
    }

    const countNow = () => cont.querySelectorAll('div[role="button"][aria-label]').length;
    let prev = -1;
    let n = countNow();
    let scrolled = 0;
    for (let r = 0; r < rounds && n !== prev; r++) {
      prev = n;
      try { if (sc) { sc.scrollTop = sc.scrollHeight; scrolled++; } } catch (e) {}
      await sleep(waitMs);
      n = countNow();
    }
    try { if (sc) sc.scrollTop = 0; } catch (e) {}

    const cards = Array.from(cont.querySelectorAll('div[role="button"][aria-label]'));
    const items = cards.map((c, i) => {
      const aria = c.getAttribute('aria-label') || '';
      const id = aria.split('--')[0] || aria;
      return { i: i + 1, name: cardName(c), aria: aria, goodsId: id };
    }).filter((x) => x.name || x.goodsId);

    return { ok: items.length > 0, count: items.length, scrolled: scrolled, items: items };
  }

  function probe(selector) {
    const list = parseSel(selector);
    if (!list.length) return { found: false, tried: 0, reason: 'empty-selector' };
    for (let i = 0; i < list.length; i++) {
      const el = resolveOne(list[i]);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      const cn = (el.getAttribute && el.getAttribute('class')) || '';
      return {
        found: true,
        tag: el.tagName,
        text: norm(el.textContent).slice(0, 60),
        cls: String(cn).slice(0, 80),
        visible: isVisible(el),
        rect: [Math.round(r.width), Math.round(r.height)],
        matched: list[i],
        matchedIndex: i,
        tried: list.length
      };
    }
    return { found: false, tried: list.length, candidates: list };
  }

  // 按评论内容定位，并在该评论容器内点「回复」，然后输入并发送
  async function replyTo(o) {
    o = o || {};
    const boxes = resolveAll(o.itemSel);
    if (!boxes.length) return { ok: false, reason: 'container-not-found' };

    for (const box of boxes) {
      const tEl = o.textSel ? resolve(o.textSel, box) : box;
      const uEl = o.userSel ? resolve(o.userSel, box) : null;
      const t = norm((tEl || box).textContent).slice(0, 200);
      const u = uEl ? norm(uEl.textContent).slice(0, 40) : '';
      if (t !== o.matchText) continue;
      if (o.matchUser && u !== o.matchUser) continue;

      if (o.replyBtnSel) {
        const btn = resolve(o.replyBtnSel, box);
        if (btn) { fire(clickable(btn)); await sleep(rand(180, 420)); }
      }

      const input = resolve(o.inputSel);
      if (!input) return { ok: false, reason: 'input-not-found' };

      const prefix = (o.replyBtnSel || !u) ? '' : ('@' + u + ' ');
      const res = await type(o.inputSel, prefix + o.replyText, { min: o.min, max: o.max, microPauseChance: 0.06 });
      if (!res.ok) return res;

      if (o.sendSel) return click(o.sendSel);
      return await pressEnter(o.inputSel);
    }
    return { ok: false, reason: 'comment-not-found' };
  }

  // ---------- 元素拾取 ----------
  let picking = false, picked = null, hoverEl = null, prevOutline = '';

  function cssPath(el) {
    const parts = [];
    let cur = el, depth = 0;
    while (cur && cur.nodeType === 1 && cur !== document.body && depth < 8) {
      if (cur.id && /^[A-Za-z][\w-]*$/.test(cur.id)) { parts.unshift('#' + cur.id); break; }
      const attrs = cur.attributes || [];
      let marked = null;
      for (let i = 0; i < attrs.length; i++) {
        if (/^data-(e2e|test|qa|spm|id|key|index|type)/i.test(attrs[i].name)) { marked = attrs[i]; break; }
      }
      if (marked) {
        parts.unshift(cur.tagName.toLowerCase() + '[' + marked.name + '="' + marked.value + '"]');
        break;
      }
      let part = cur.tagName.toLowerCase();
      const p = cur.parentElement;
      if (p) {
        const same = Array.from(p.children).filter(c => c.tagName === cur.tagName);
        if (same.length > 1) part += ':nth-of-type(' + (same.indexOf(cur) + 1) + ')';
      }
      parts.unshift(part);
      cur = cur.parentElement;
      depth++;
    }
    return parts.join(' > ');
  }

  function onMove(e) {
    if (!picking) return;
    const el = e.target;
    if (!el || el === document.body || el === hoverEl) return;
    if (hoverEl) hoverEl.style.outline = prevOutline;
    hoverEl = el;
    prevOutline = el.style.outline;
    el.style.outline = '2px solid #2f6feb';
  }

  function firstClassSel(el) {
    const cn = (el.getAttribute && el.getAttribute('class')) || '';
    const first = cn.split(/\s+/).filter(Boolean)[0];
    if (!first) return '';
    try {
      const n = document.querySelectorAll('.' + CSS.escape(first)).length;
      return (n >= 1 && n <= 8) ? '.' + first : '';
    } catch (e) { return ''; }
  }

  function onClick(e) {
    if (!picking) return;
    e.preventDefault();
    e.stopPropagation();
    const el = e.target;
    const text = norm(el.textContent);
    const t = clickable(el);
    picked = {
      selector: cssPath(el),
      attrSelector: attrSel(el),
      classSelector: firstClassSel(t) || firstClassSel(el),
      text: text.slice(0, 60),
      tag: el.tagName,
      textSelector: text && text.length <= 24 ? 'text=' + text : ''
    };
    stopPick();
  }

  function onKey(e) { if (e.key === 'Escape') { picked = null; stopPick(); } }

  function startPick() {
    picking = true; picked = null;
    document.addEventListener('mousemove', onMove, true);
    document.addEventListener('click', onClick, true);
    document.addEventListener('keydown', onKey, true);
    document.body.style.cursor = 'crosshair';
    return true;
  }

  function stopPick() {
    picking = false;
    document.removeEventListener('mousemove', onMove, true);
    document.removeEventListener('click', onClick, true);
    document.removeEventListener('keydown', onKey, true);
    if (hoverEl) { hoverEl.style.outline = prevOutline; hoverEl = null; }
    if (document.body) document.body.style.cursor = '';
  }

  // ---------- 页面元素扫描 ----------
  // 把当前页面里像"能点 / 能输入"的元素列出来，附带建议写法。
  // 没进直播间也能扫后台其它页面，用来确认 class 名该怎么写。
  function scan(limit) {
    const max = limit || 150;
    const q = 'button,a,[role="button"],input,textarea,select,[contenteditable="true"],' +
      '[class*="btn"],[class*="Btn"],[class*="button"],[class*="Button"],[class*="tab"],[class*="item"],[class*="card"]';
    let nodes = [];
    try { nodes = document.querySelectorAll(q); } catch (e) { return []; }
    const out = [];
    const seen = {};
    for (let i = 0; i < nodes.length && out.length < max; i++) {
      const el = nodes[i];
      if (!isVisible(el)) continue;
      const tag = el.tagName.toLowerCase();
      const isField = tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
      const text = norm(el.textContent).slice(0, 30);
      if (!isField && !text) continue;
      if (!isField && text.length > 30) continue;
      const cn = el.getAttribute('class') || '';
      const key = tag + '|' + cn + '|' + text;
      if (seen[key]) continue;
      seen[key] = 1;

      const cand = [];
      const push = (v) => { if (v && cand.indexOf(v) < 0) cand.push(v); };
      push(attrSel(el));
      if (tag === 'input' || tag === 'textarea' || el.isContentEditable) {
        if (el.getAttribute('placeholder')) push(tag + '[placeholder="' + el.getAttribute('placeholder') + '"]');
      }
      if (text && text.length <= 12) push('text=' + text);
      if (cn) {
        const first = cn.split(/\s+/).filter(Boolean)[0];
        if (first) push('.' + first);
      }
      push(cssPath(el));

      out.push({
        tag,
        text,
        cls: String(cn).slice(0, 90),
        field: isField,
        selector: cand[0],
        candidates: cand.slice(0, 3)
      });
    }
    return out;
  }

  // ---------- 优惠券 ----------
  // 真机结构（2026-10-21）：营销工具卡「优惠券」→ 抽屉 .okee-current-live-drawer-dialog，
  // 表格列：优惠券名称/状态/创建人/满减额度/总库存/可用库存/优惠券ID/投放ID/操作(发放优惠券)。
  // 点「发放优惠券」→ 弹窗：数量 10张/50张/100张/500张/1000张(库存不足会禁用)/自定义/全部库存
  //                  + 时长 1/3/5/10分钟/自定义 + 取消/确定发放。
  // 读抽屉里的券列表（先由调用方点开「优惠券」入口）。返回每行的文案 + 发放按钮坐标。
  // 券表格的行：不依赖具体的抽屉/弹窗类名（后台改过好几次），
  // 只认「这一行里有『发放优惠券』按钮」——这是唯一稳定的特征。
  function couponRows() {
    const n1 = (s) => String(s || '').replace(/\s+/g, ' ').trim();
    let best = [];
    let nodes = [];
    try { nodes = document.querySelectorAll('tr'); } catch (e) { nodes = []; }
    const rows = [];
    Array.prototype.forEach.call(nodes, (tr) => {
      const btns = Array.from(tr.querySelectorAll('button'));
      const btn = btns.find((b) => /发放优惠券/.test(n1(b.textContent)));
      if (!btn) return;
      const cells = Array.from(tr.children).map((c) => n1(c.textContent));
      if (cells.length < 4) return;
      rows.push({ tr: tr, btn: btn, cells: cells });
    });
    if (rows.length > best.length) best = rows;
    return best;
  }

  function couponPanelRows() {
    const rows = couponRows();
    const out = rows.map((x) => {
      const cells = x.cells;
      // 关键：表格可能在 iframe 里，必须换算成顶层视口坐标，否则点不中
      const abs = absCenterOf(x.btn) || (() => { const r = x.btn.getBoundingClientRect(); return { x: Math.round(r.x + r.width / 2), y: Math.round(r.y + r.height / 2) }; })();
      return {
        name: String(cells[0] || '').replace(/复制ID$/, ''),
        status: cells[1] || '',
        creator: cells[2] || '',
        value: cells[3] || '',
        stock: cells[4] || '',
        avail: cells[5] || '',
        id: cells[6] || '',
        kind: /折/.test(cells[3] || '') ? 'discount' : (/元/.test(cells[3] || '') ? 'cash' : 'full'),
        btn: abs
      };
    });
    return { ok: out.length > 0, count: out.length, rows: out, reason: out.length ? '' : 'no-row' };
  }

  // ---------- 接口直调（不操作画面） ----------
  // 实测（2026-10-22）：页面自己的 window.fetch 被 secsdk 包装过，
  // 在页面上下文里 fetch 后台接口，a_bogus 签名会自动补上 ——
  // 效果和"点按钮"发出的请求完全一样，但不碰画面、不占输入框。
  // 目前只有发评论验证过；讲解/发券走长连接，抓不到 HTTP。
  const ID_CACHE = { at: 0, roomId: '', userId: '' };

  // 页面自己的请求里就带着 room_id（中控台一直在轮询），装个"听筒"偷看一眼。
  // 注意：XHR 不会进 performance 资源列表，只能从 XHR/fetch 的 URL 上截。
  // 必须用 window 上的标记做幂等：tp-lib 会被反复注入（每次调用都可能重新注入一次），
  // 用闭包变量判断的话每次注入都以为"没装过"，会把 fetch/XHR 越包越多层 → 页面越跑越卡。
  function installSniffer() {
    if (window.__TP_SNIFF) return;
    window.__TP_SNIFF = true;
    window.__TPU = window.__TPU || [];
    const U = window.__TPU;
    const push = (u) => { if (U.length < 400) U.push(String(u)); };
    const rawOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (m, u) { push(u); return rawOpen.apply(this, arguments); };
    const rawFetch = window.fetch;
    window.fetch = function (a) { push(typeof a === 'string' ? a : ((a && a.url) || '')); return rawFetch.apply(this, arguments); };
  }
  // 等页面自然发出一个匹配 URL（轮询 1 秒一次，通常几百毫秒就等到）
  async function sniffMatch(re, ms) {
    installSniffer();
    const t0 = Date.now();
    for (;;) {
      const arr = window.__TPU || [];
      for (let i = arr.length - 1; i >= 0; i -= 1) {
        const m = String(arr[i]).match(re);
        if (m) return m;
      }
      if (Date.now() - t0 > (ms || 0)) return null;
      await new Promise((r) => setTimeout(r, 250));
    }
  }

  async function apiIds(preferUserId) {
    if (preferUserId) ID_CACHE.userId = String(preferUserId);
    if (ID_CACHE.roomId && ID_CACHE.userId && Date.now() - ID_CACHE.at < 5 * 60 * 1000) return ID_CACHE;
    let roomId = ID_CACHE.roomId || '';
    let userId = ID_CACHE.userId || '';

    // ① 听页面自己的请求（最靠谱：轮询里必带 room_id，还顺带能拿到 sec_uid）
    if (!roomId) {
      const m = await sniffMatch(/[?&]room_id=(\d{10,})/, 8000);
      if (m) roomId = m[1];
    }
    if (!userId) {
      const m = await sniffMatch(/(MS4wLjABAAAA[\w\-]{20,})/, 0);
      if (m) userId = m[1];
    }

    // ② 评论轮询接口的响应里带 wss_push_room_id（GET，只靠 cookie）
    if (!roomId || !userId) {
      try {
        const r = await fetch('/data/life/live/comment/im_list/?offset=0&count=0', { credentials: 'include' });
        const t = await r.text();
        if (!roomId) {
          let m = t.match(/wss_push_room_id[:=]?\s*"?(\d{12,})/);
          if (m) roomId = m[1];
          if (!roomId) { m = t.match(/"room_id"\s*:\s*"?(\d{12,})/); if (m) roomId = m[1]; }
        }
        if (!userId) {
          const m = t.match(/(MS4wLjABAAAA[\w\-]{20,})/);
          if (m) userId = m[1];
        }
      } catch (e) {}
    }

    // ③ DOM / storage 里找主播自己的 sec_uid
    if (!userId) {
      try {
        const m = (document.documentElement.innerHTML || '').match(/MS4wLjABAAAA[\w\-]{20,}/);
        if (m) userId = m[0];
      } catch (e) {}
    }
    if (!userId) {
      try {
        let dump = '';
        for (let i = 0; i < localStorage.length && i < 200; i++) {
          const k = localStorage.key(i);
          dump += String(k) + '=' + String(localStorage.getItem(k) || '') + '|';
        }
        const m = dump.match(/MS4wLjABAAAA[\w\-]{20,}/);
        if (m) userId = m[0];
      } catch (e) {}
    }

    ID_CACHE.roomId = roomId;
    ID_CACHE.userId = userId;
    ID_CACHE.at = Date.now();
    return ID_CACHE;
  }

  // 发一条公屏评论（接口调用）。成功返回 {ok:true, chatId}
  async function apiComment(text, preferUserId) {
    const content = String(text || '').trim();

    if (!ids.roomId) return { ok: false, reason: 'no-room-id', ids: ids };
    if (!ids.userId) return { ok: false, reason: 'no-user-id', ids: ids };
    const body = {
      room_id: String(ids.roomId),
      user_id: String(ids.userId),
      comment_content: content,
      nickname: '',
      origin_msg_content: '',
      origin_msg_id: ''
    };

        method: 'POST',

      });
      const txt = await res.text();
      let j = null;
      try { j = JSON.parse(txt); } catch (e) { j = null; }
      if (!j) return { ok: false, reason: 'bad-json', http: res.status, text: String(txt).slice(0, 120), ids: ids };
      const code = (j.code != null) ? j.code : j.status_code;
      if (code === 0) return { ok: true, chatId: j.chat_id || '', how: 'api', ids: ids };
      return { ok: false, reason: String(j.msg || j.status_msg || ('code ' + code)), raw: String(txt).slice(0, 160), ids: ids };
    } catch (e) {
      return { ok: false, reason: String(e && e.message || e), ids: ids };

  // ============================================================
  // 直播间只读数据接口
  //
  // 这些路径对照的是 eos.douyin.com 本地生活直播中控台自己就在用的接口
  // （页面里 1 秒轮询 /comment/im_list，商品列表来自 /shelves/anchor）。
  // 在页面上下文里 fetch，同源 + 带 cookie + secsdk 自动补签，等价于页面自己发的请求。
  // 全部只读，不改直播间状态，失败只影响面板显示。
  // ============================================================
  async function apiReq(path, opts) {
    opts = opts || {};
    const method = (opts.method || 'GET').toUpperCase();
    let url = path;
    if (opts.query && Object.keys(opts.query).length) {
      const qs = new URLSearchParams(opts.query).toString();
      url += (url.indexOf('?') >= 0 ? '&' : '?') + qs;
    }
    const init = { method: method, credentials: 'include' };
    if (method !== 'GET') {
      init.headers = { 'content-type': 'application/json' };
      init.body = JSON.stringify(opts.body || {});
    }
    let res;
    try {
      res = await fetch(url, init);
    } catch (e) {
      return { ok: false, reason: 'net:' + String(e && e.message || e) };
    }
    let txt = '';
    try { txt = await res.text(); } catch (e) { txt = ''; }
    let j = null;
    try { j = JSON.parse(txt); } catch (e) { j = null; }
    if (!j) {
      return { ok: false, reason: (res.status === 404 ? 'no-endpoint' : 'bad-json'), http: res.status, text: String(txt).slice(0, 100) };
    }
    const code = (j.status_code != null) ? j.status_code : j.code;
    const ok = (code === 0);
    return {
      ok: ok,
      code: code,
      reason: ok ? '' : String(j.status_msg || j.msg || ('code ' + code)),
      data: j
    };
  }

  // 实时大屏：在线人数 / 累计观看 / 涨粉 / 成交单数 / GMV / 观看-支付转化率

      return Number.isFinite(n) ? n : null;
    };
    return {
      ok: true,
      stats: {
        online: num(d.online_watch_ucnt),
        watch: num(d.live_watch_ucnt),
        follow: num(d.live_follow_cnt),
        order: num(d.live_order_cnt),

        payRate: (d.ViewPayRate == null ? null : Number(d.ViewPayRate)),
        createTime: d.create_time || ''
      },

    };
